[package]
name = "heads_up_bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Heads-Up: a first-person endless strolling experience focused on the golden-hour sky (Bevy 0.20 migration of the original Godot 4.7 project)"
license = "MIT OR Apache-2.0"

[workspace]
# Single-package workspace root; members may be split out later if needed.

[dependencies]
bevy = { version = "=0.20.0", features = ["serialize"] }
bevy_elements = "0.5.3"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# Keep iteration fast while still allowing debuggable game code.
opt-level = 1
# Line tables only: cuts debuginfo generation memory and disk use hard while
# keeping file/line info in backtraces (32 GB host, parallel bevy builds).
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies get moderate optimization: 2 keeps the runtime fast enough for
# atmosphere/cloud iteration on this machine while easing parallel rustc peak
# memory (opt-level 3 pushed parallel bevy compiles past the host's budget).
opt-level = 2
