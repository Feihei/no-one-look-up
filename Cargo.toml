[package]
name = "no_one_looks_up"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "No One Looks Up Even Alone: a first-person endless strolling experience focused on the golden-hour sky (Bevy 0.20 migration of the original Godot 4.7 project)"
license = "MIT OR Apache-2.0"

[workspace]
# Single-package workspace root; members may be split out later if needed.
# The vendored cloud crate is a `[patch]` source, not a workspace member: it
# has its own lockfile and tests.
exclude = ["vendor/bevy_elements"]

[dependencies]
bevy = { version = "=0.20.1", features = ["serialize"] }
bevy_elements = "0.6.0"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# bevy_elements with three cloud fixes the game needs and the crate does not
# expose: the shader's dome factor is fully saturated for any cloud type at or
# above 0.25 (so stratocumulus renders as a flat disc with half an egg on top),
# its rounding curve is a clean sqrt, and `sky_gain` brightens the sky as cover
# rises. See `vendor/bevy_elements/PATCHES.md`. Re-merge these on upgrade.
bevy_elements = { path = "vendor/bevy_elements" }

[profile.dev]
# Keep iteration fast while still allowing debuggable game code.
opt-level = 1
# Line tables only: cuts debuginfo generation memory and disk use hard while
# keeping file/line info in backtraces (32 GB host, parallel bevy builds).
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies get moderate optimization: 2 keeps the runtime fast enough for
# atmosphere/cloud iteration on this machine while easing parallel rustc peak
# memory (opt-level 3 pushed parallel bevy compiles past the host's budget).
opt-level = 2
